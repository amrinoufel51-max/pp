</head>
<body>

<div id="splashScreen">
    <div class="splash-content">
        <div class="splash-logo">La Source</div>
        <div class="splash-spinner"></div>
        <div class="splash-tagline">Annuaire Multi-Secteurs</div>
    </div>
</div>

<div id="loader"></div>

<div class="backdrop-fx">
    <div class="glow-mesh"></div>
    <div id="particles-js"></div>
    <div id="bubbles-container"></div>
</div>

<div class="top-bar">
    <button class="menu-toggle-btn" onclick="toggleSidebar()">☰</button>
    <div class="top-actions">
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">☀️</button>
        <button class="back-home-btn" id="backHomeBtn" style="display: none;" onclick="resetToSectors()">⬅️ Secteurs</button>
    </div>
</div>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <h3 class="sidebar-title">La Source</h3>
        <button class="sidebar-close-btn" onclick="toggleSidebar()">×</button>
    </div>
    <div class="sidebar-links">
        <a class="sidebar-link-item" onclick="openLegalModal('about'); toggleSidebar();">ℹ️ About Us</a>
        <a class="sidebar-link-item" onclick="openLegalModal('privacy'); toggleSidebar();">🔒 Privacy Policy</a>
        <a class="sidebar-link-item" onclick="openLegalModal('contact'); toggleSidebar();">📞 Contact Us</a>
    </div>
    <div class="sidebar-footer">
        &copy; 2026 La Source. Tous droits réservés.
    </div>
</div>

<div class="container" id="mainContainer">
    <div class="title-wrapper">
        <div class="site-title" onclick="window.location.reload()">
            <div class="word-group">
                <span>L</span><span>a</span>
            </div>
            <div class="word-group">
                <span>S</span><span>o</span><span>u</span><span>r</span><span>c</span><span>e</span>
            </div>
        </div>
    </div>

    <!-- 1. Sectors Selection View (Glassmorphism Cards) -->
    <div id="sectorsView">
        <p class="section-heading-title">Choisissez un secteur d'activité</p>
        <div class="sectors-grid">
            <div class="sector-card" onclick="selectSector('restaurants', 'Restaurants')">
                <div class="sector-icon-wrapper">🍽️</div>
                <div class="sector-info">
                    <span class="sector-name">Restaurants</span>
                    <span class="sector-desc">Découvrez les meilleures tables</span>
                </div>
            </div>
            <div class="sector-card" onclick="selectSector('homemade', 'Homemade')">
                <div class="sector-icon-wrapper">🍲</div>
                <div class="sector-info">
                    <span class="sector-name">Homemade</span>
                    <span class="sector-desc">Plats traditionnels et faits maison</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. Wilaya Search & Results View -->
    <div id="searchView">
        <div class="search-container-relative">
            <div class="search-box-wrapper">
                <span style="margin-right: 10px; font-size: 20px;">📍</span>
                <input type="text" id="wilayaInput" placeholder="Entrez votre Wilaya (ex: constantine, alger)..." oninput="handleWilayaInput()" autocomplete="off">
                <button class="clear-search-btn" id="clearWilayaBtn" onclick="clearWilayaInput()">×</button>
            </div>
            <div id="suggestionsDropdown" class="suggestions-dropdown"></div>
        </div>

        <div id="itemNameSearchWrapper">
            <span style="margin-right: 10px; font-size: 20px;">🔍</span>
            <input type="text" id="itemNameInput" placeholder="Filtrer par nom (optionnel)..." oninput="filterByName()">
        </div>

        <div id="resultsContainer" class="grid-container"></div>
    </div>
</div>

<button id="scrollTopBtn" onclick="scrollToTop()">⬆️</button>

<div id="itemModal" class="modal-overlay" onclick="closeModalOnOutside(event)">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">×</button>
        <h2 id="modalName" class="modal-title"></h2>
        <div id="modalGallery" class="modal-gallery"></div>
    </div>
</div>

<script>
    window.addEventListener("load", () => {
        setTimeout(() => {
            let splash = document.getElementById("splashScreen");
            splash.classList.add("expand");
            splash.classList.add("fade-out");
            
            setTimeout(() => {
                splash.remove();
            }, 900);
        }, 3000);
    });

    const wilayasList = [
        "adrar", "chlef", "laghouat", "oum_el_bouaghi", "batna", "bejaia", "biskra", "bechar", 
        "blida", "bouira", "tamanrasset", "tbessa", "tlemcen", "tiaret", "tizi_ouzou", "alger", 
        "djelfa", "jijel", "setif", "saida", "skikda", "sidi_bel_abbes", "annaba", "guelma", 
        "constantine", "medea", "mostaganem", "msila", "mascara", "ouargla", "oran", "el_bayadh", 
        "illizi", "bordj_bou_arreridj", "boumerdes", "el_tarf", "tindouf", "tissemsilt", "el_oued", 
        "khenchela", "souk_ahras", "tipaza", "mila", "ain_defla", "naama", "ain_temouchent", 
        "ghardaia", "relizane", "timimoun", "bordj_badji_mokhtar", "ouled_djellal", "beni_abbes", 
        "in_guezzam", "in_salah", "janet", "el_meghaier", "el_meniaa"
    ];

    let currentSectorKey = "";
    let currentSectorName = "";
    let allItems = [];
    let filteredItems = [];
    let displayedCount = 0;
    const batchSize = 10;
    let currentMatchedWilaya = "";

    function toggleTheme() {
        const html = document.documentElement;
        const btn = document.getElementById("themeToggleBtn");
        if (html.getAttribute("data-theme") === "dark") {
            html.setAttribute("data-theme", "light");
            btn.innerText = "🌙";
        } else {
            html.setAttribute("data-theme", "dark");
            btn.innerText = "☀️";
        }
    }

    function selectSector(key, name) {
        currentSectorKey = key;
        currentSectorName = name;
        
        document.getElementById("sectorsView").style.display = "none";
        document.getElementById("searchView").style.display = "flex";
        document.getElementById("backHomeBtn").style.display = "flex";

        let mainContainer = document.getElementById("mainContainer");
        mainContainer.style.justifyContent = "flex-start";
        mainContainer.style.minHeight = "unset";

        document.getElementById("wilayaInput").focus();
    }

    function resetToSectors() {
        document.getElementById("searchView").style.display = "none";
        document.getElementById("sectorsView").style.display = "flex";
        document.getElementById("backHomeBtn").style.display = "none";

        let mainContainer = document.getElementById("mainContainer");
        mainContainer.style.justifyContent = "center";
        mainContainer.style.minHeight = "75vh";

        clearWilayaInput();
        document.getElementById("resultsContainer").innerHTML = "";
        document.getElementById("itemNameSearchWrapper").style.display = "none";
        document.getElementById("suggestionsDropdown").style.display = "none";
    }

    function createParticles() {
        const container = document.getElementById("particles-js");
        for (let i = 0; i < 25; i++) {
            let p = document.createElement("div");
            p.className = "particle";
            p.style.left = Math.random() * 100 + "%";
            p.style.width = p.style.height = (Math.random() * 4 + 2) + "px";
            p.style.animationDuration = (Math.random() * 6 + 6) + "s";
            p.style.animationDelay = (Math.random() * 5) + "s";
            container.appendChild(p);
        }
    }

    function createBubbles() {
        const container = document.getElementById("bubbles-container");
        for (let i = 0; i < 15; i++) {
            let b = document.createElement("div");
            b.className = "bubble";
            let size = Math.random() * 35 + 15;
            b.style.width = size + "px";
            b.style.height = size + "px";
            b.style.left = Math.random() * 100 + "%";
            b.style.animationDuration = (Math.random() * 8 + 6) + "s";
            b.style.animationDelay = (Math.random() * 5) + "s";
            container.appendChild(b);
        }
    }

    createParticles();
    createBubbles();

    function toggleSidebar() {
        let sidebar = document.getElementById("sidebar");
        let overlay = document.getElementById("sidebarOverlay");
        
        if (sidebar.classList.contains("active")) {
            sidebar.classList.remove("active");
            overlay.style.display = "none";
        } else {
            sidebar.classList.add("active");
            overlay.style.display = "block";
        }
    }

    function handleWilayaInput() {
        let query = document.getElementById("wilayaInput").value.trim().toLowerCase();
        let clearBtn = document.getElementById("clearWilayaBtn");
        let dropdown = document.getElementById("suggestionsDropdown");

        clearBtn.style.display = query.length > 0 ? "block" : "none";

        if (query === "") {
            dropdown.style.display = "none";
            searchData("");
            return;
        }

        let matches = wilayasList.filter(w => w.includes(query));
        
        if (matches.length > 0) {
            dropdown.innerHTML = "";
            matches.forEach(match => {
                let div = document.createElement("div");
                div.className = "suggestion-item";
                div.innerText = match.toUpperCase().replace(/_/g, " ");
                div.onclick = () => {
                    document.getElementById("wilayaInput").value = match;
                    dropdown.style.display = "none";
                    document.getElementById("clearWilayaBtn").style.display = "block";
                    searchData(match);
                };
                dropdown.appendChild(div);
            });
            dropdown.style.display = "block";
        } else {
            dropdown.style.display = "none";
        }

        searchData(query);
    }

    function clearWilayaInput() {
        document.getElementById("wilayaInput").value = "";
        document.getElementById("clearWilayaBtn").style.display = "none";
        document.getElementById("suggestionsDropdown").style.display = "none";
        searchData("");
    }

    async function searchData(query) {
        let loader = document.getElementById("loader");
        loader.style.width = "100%";

        let formattedQuery = query.trim().toLowerCase().replace(/\s+/g, "_");
        let container = document.getElementById("resultsContainer");
        let itemNameSearchWrapper = document.getElementById("itemNameSearchWrapper");
        
        container.innerHTML = "";
        allItems = [];
        filteredItems = [];
        displayedCount = 0;
        currentMatchedWilaya = "";
        itemNameSearchWrapper.style.display = "none";
        document.getElementById("itemNameInput").value = "";

        if (formattedQuery === "") {
            loader.style.width = "0%";
            return;
        }

        let matchedWilaya = wilayasList.find(w => w === formattedQuery || w.startsWith(formattedQuery));

        if (!matchedWilaya) {
            loader.style.width = "0%";
            container.innerHTML = "<p class='no-result'>Wilaya introuvable...</p>";
            return;
        }

        currentMatchedWilaya = matchedWilaya;

        try {
            let partIndex = 1;
            let combinedData = [];

            while (true) {
                let fileName = partIndex === 1 ? `${matchedWilaya}_${currentSectorKey}.json` : `${matchedWilaya}_${currentSectorKey}_${partIndex}.json`;
                try {
                    let response = await fetch(fileName);
                    if (!response.ok) break;
                    let data = await response.json();
                    combinedData = combinedData.concat(data);
                    partIndex++;
                } catch (e) {
                    break;
                }
            }

            if (combinedData.length === 0) {
                loader.style.width = "0%";
                container.innerHTML = `<p class='no-result'>Aucun résultat pour ${matchedWilaya.toUpperCase()} dans ce secteur.</p>`;
                return;
            }

            allItems = combinedData;
            filteredItems = combinedData;
            loader.style.width = "0%";

            itemNameSearchWrapper.style.display = "flex";
            renderMoreItems();

        } catch (error) {
            loader.style.width = "0%";
            container.innerHTML = "<p class='no-result'>Erreur de chargement.</p>";
        }
    }

    function filterByName() {
        let nameQuery = document.getElementById("itemNameInput").value.trim().toLowerCase();
        let container = document.getElementById("resultsContainer");
        
        container.innerHTML = "";
        displayedCount = 0;

        if (nameQuery === "") {
            filteredItems = allItems;
        } else {
            filteredItems = allItems.filter(item => item.name.toLowerCase().includes(nameQuery));
        }

        if (filteredItems.length === 0) {
            container.innerHTML = "<p class='no-result'>Aucun résultat trouvé avec ce nom...</p>";
            return;
        }

        renderMoreItems();
    }

    function renderMoreItems() {
        let container = document.getElementById("resultsContainer");
        let nextBatch = filteredItems.slice(displayedCount, displayedCount + batchSize);

        nextBatch.forEach((item, index) => {
            let card = document.createElement("div");
            card.className = "item-card";
            card.style.animationDelay = `${index * 0.08}s`;
            
            let itemAddress = item.address ? item.address : (currentMatchedWilaya.toUpperCase() + ", Algérie");

            card.innerHTML = `
                <div class="profile-img-wrapper">
                    <img src="${item.profileImg}" alt="${item.name}" class="profile-img" loading="lazy">
                </div>
                <div class="item-info">
                    <h3>${item.name}</h3>
                    <p>📍 ${itemAddress}</p>
                    <p>📞 ${item.phone}</p>
                    <div class="card-actions">
                        <button class="details-trigger-btn" onclick='openModal(${JSON.stringify(item).replace(/'/g, "&#39;")})'>Menu</button>
                        <a href="tel:${item.phone}" class="phone-action-btn">📞 Appeler</a>
                    </div>
                </div>
            `;
            
            container.appendChild(card);
        });

        displayedCount += nextBatch.length;
    }

    window.addEventListener("scroll", () => {
        let scrollTopBtn = document.getElementById("scrollTopBtn");
        if (window.scrollY > 300) {
            scrollTopBtn.style.display = "flex";
        } else {
            scrollTopBtn.style.display = "none";
        }

        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 300) {
            if (displayedCount < filteredItems.length) {
                renderMoreItems();
            }
        }
    });

    function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openModal(item) {
        document.getElementById("modalName").innerText = item.name + " - Menu";
        let galleryContainer = document.getElementById("modalGallery");
        galleryContainer.innerHTML = "";

        let images = item.menuImages || item.images || [];

        if (images.length === 0) {
            galleryContainer.innerHTML = "<p style='color: var(--text-muted);'>Aucun menu disponible pour le moment.</p>";
        } else {
            images.forEach((imgSrc) => {
                let img = document.createElement("img");
                img.src = imgSrc;
                img.className = "hd-modal-img";
                img.alt = "Image";
                img.loading = "lazy";
                galleryContainer.appendChild(img);
            });
        }

        document.getElementById("itemModal").style.display = "flex";
    }

    function closeModal() {
        document.getElementById("itemModal").style.display = "none";
    }

    function closeModalOnOutside(event) {
        let modalContent = document.querySelector(".modal-content");
        if (!modalContent.contains(event.target)) {
            closeModal();
        }
    }

    function openLegalModal(type) {
        let modalName = document.getElementById("modalName");
        let galleryContainer = document.getElementById("modalGallery");
        
        document.getElementById("itemModal").style.display = "flex";
        
        if (type === 'about') {
            modalName.innerText = "À propos de La Source";
            galleryContainer.innerHTML = `
                <p style="color: var(--text-muted); line-height: 1.6; text-align: left;">
                    <strong>La Source</strong> est votre annuaire multi-secteurs de référence à travers toutes les wilayas d'Algérie. Notre mission est de simplifier l'accès rapide et fluide aux informations et services locaux.
                </p>
            `;
        } else if (type === 'privacy') {
            modalName.innerText = "Politique de Confidentialité";
            galleryContainer.innerHTML = `
                <p style="color: var(--text-muted); line-height: 1.6; text-align: left;">
                    Chez <strong>La Source</strong>, nous respectons votre vie privée. Aucune donnée personnelle sensible n'est collectée.
                </p>
            `;
        } else if (type === 'contact') {
            modalName.innerText = "Contactez-nous";
            galleryContainer.innerHTML = `
                <p style="color: var(--text-muted); line-height: 1.6; text-align: left;">
                    Vous souhaitez ajouter votre établissement ou nous contacter ?
                </p>
                <p style="color: var(--text-color); text-align: left; margin-top: 15px;">
                    📧 Email : <a href="mailto:amrinoufel51@gmail.com" style="color: var(--text-color); text-decoration: underline;">amrinoufel51@gmail.com</a><br><br>
                    📞 Téléphone : <a href="tel:0549770854" style="color: var(--text-color); text-decoration: underline;">0549770854</a>
                </p>
            `;
        }
    }
</script>

</body>
</html>
